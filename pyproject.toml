[project]
name = "meltano-tap-hubspot"
dynamic = ["version"]
description = "`tap-hubspot` is a Singer tap for tap-hubspot, built with the Meltano Singer SDK."
readme = "README.md"
authors = [{ name = "Ethan Stein" }]
keywords = [
    "ELT",
    "tap-hubspot",
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3,<3",
    "singer-sdk>=0.41.0,<0.42",
]

[project.optional-dependencies]
s3 = ["fs-s3fs>=1.1.1,<2"]

[project.scripts]
# CLI declaration
tap-hubspot = "tap_hubspot.tap:TapHubspot.cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "requests-mock>=1.12.1,<2",
    "ruff>=0.17.3",
    "singer-sdk[testing]>=0.41.0,<0.42",
    "ty>=0.0.95",
]

[tool.ruff]
src = ["tap_hubspot", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # conflicts with the formatter
    "CPY001",  # no copyright headers
    "D415",    # docstring punctuation
    "FIX002",  # TODOs are allowed
    "TD002",   # TODO author
    "TD003",   # TODO issue link
    "RUF012",  # singer-sdk declares stream attributes as mutable class defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ANN",      # type annotations
    "ARG",      # unused arguments (mock callbacks)
    "D103",     # docstrings on test functions
    "PLR2004",  # magic values
    "S101",     # assert
    "S105",     # dummy credentials
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["tap_hubspot"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Used when building outside a git checkout (e.g. a source archive)
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["tap_hubspot"]
